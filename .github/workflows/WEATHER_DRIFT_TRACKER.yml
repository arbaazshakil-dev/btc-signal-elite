name: Weather Forecast Drift Tracker

on:
  schedule:
    # Runs 3x/day (12am, 12pm, 6pm UTC) to catch forecast updates without
    # spamming the NWS API. Adjust to taste.
    - cron: "0 0,12,18 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from GitHub's UI on your phone

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run drift tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python weather_drift_tracker.py --days 0 1 2 3 5 7
