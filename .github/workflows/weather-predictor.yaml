name: Weather Predictor

on:
  schedule:
    - cron: "0 12,18,0 * * *"  # runs at 12pm, 6pm, midnight UTC — adjust as needed
  workflow_dispatch:  # lets you manually trigger it from the Actions tab too

jobs:
  run-weather-predictor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run weather predictor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python weather_predictor.py
