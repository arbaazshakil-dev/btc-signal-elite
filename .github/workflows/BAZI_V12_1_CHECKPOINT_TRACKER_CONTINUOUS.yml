name: BAZI V12.1 Checkpoint Tracker

on:
  schedule:
    # Start once per hour. The worker itself stays alive for ~58 minutes,
    # which avoids the 30-minute gaps that could miss checkpoint windows.
    - cron: "2 * * * *"

  workflow_dispatch:

concurrency:
  group: bazi-v12-1-checkpoint-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkpoint-track:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests==2.32.5

      - name: Record and resolve checkpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KALSHI_SERIES: KXBTC15M
          BAZI_PASSES: "175"
          BAZI_PASS_INTERVAL: "20"

        run: python bazi_checkpoint_worker_V12_1a.py
